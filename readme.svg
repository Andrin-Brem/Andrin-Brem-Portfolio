<svg xmlns="http://www.w3.org/2000/svg" width="860" height="900" viewBox="0 0 860 900">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <pattern id="net" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#3b82f6" stroke-opacity=".45"/>
    </pattern>
    <style>
      .mono{font-family:'Cascadia Code','Fira Code',Consolas,'Courier New',monospace}
      .tw{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    </style>
  </defs>

  <!-- karte -->
  <rect width="860" height="900" rx="18" fill="#0d1117"/>
  <rect x="50" y="24" width="760" height="3" rx="1.5" fill="url(#line)"/>

  <!-- sterne -->
  <g fill="#cfe3ff">
    <circle class="tw" cx="300" cy="70" r="1.4"/>
    <circle class="tw" cx="380" cy="110" r="1" style="animation-delay:.7s"/>
    <circle class="tw" cx="470" cy="62" r="1.6" style="animation-delay:1.4s"/>
    <circle class="tw" cx="540" cy="120" r="1.1" style="animation-delay:.3s"/>
    <circle class="tw" cx="610" cy="80" r="1.4" style="animation-delay:2s"/>
    <circle class="tw" cx="760" cy="70" r="1.2" style="animation-delay:1s"/>
    <circle class="tw" cx="110" cy="150" r="1.2" style="animation-delay:2.4s"/>
    <circle class="tw" cx="250" cy="160" r="1" style="animation-delay:1.7s"/>
  </g>

  <!-- anzeigetafel -->
  <rect x="80" y="60" width="160" height="42" rx="10" fill="#111a2b" stroke="#1f3b63"/>
  <text x="160" y="86" text-anchor="middle" class="mono" font-size="14" fill="#93c5fd" xml:space="preserve">andrin  1 : 0</text>

  <!-- tor -->
  <g>
    <rect x="640" y="165" width="140" height="120" fill="url(#net)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;5 0;-3 0;0 0;0 0" keyTimes="0;.6;.64;.68;.72;1" dur="3s" repeatCount="indefinite"/>
  </g>
  <path d="M640 285V165H780V285" fill="none" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="710" y="150" text-anchor="middle" class="mono" font-size="15" fill="#60a5fa" opacity="0">goal!
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.6;.62;.95;1" dur="3s" repeatCount="indefinite"/></text>

  <!-- spieler -->
  <g class="mono" font-size="18" fill="#e6edf3" xml:space="preserve">
    <text x="140" y="240">   o</text>
    <text x="140" y="258">  /|__</text>
    <text x="140" y="276">  / \</text>
  </g>

  <!-- ball -->
  <g>
    <circle r="9" fill="#e6edf3" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M-9 0H9M0-9C-4-4-4 4 0 9" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
    <animateMotion path="M205 245Q430 70 700 228" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- boden -->
  <line x1="60" y1="286" x2="800" y2="286" stroke="#2f5fa8"/>
  <line x1="80" y1="302" x2="780" y2="302" stroke="#3b82f6" stroke-opacity=".7" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="110" y1="316" x2="750" y2="316" stroke="#3b82f6" stroke-opacity=".35" stroke-dasharray="6 12">
    <animate attributeName="stroke-dashoffset" from="0" to="36" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- intro -->
  <text x="430" y="368" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">hoi, ich bin andrin · das ist meine portfolio-website</text>

  <!-- seiten -->
  <text x="90" y="415" class="mono" font-size="14" fill="#60a5fa">die seiten</text>
  <line x1="190" y1="411" x2="800" y2="411" stroke="#1f3b63" stroke-dasharray="3 4"/>

  <g class="mono" font-size="13">
    <text x="90" y="452" fill="#3b5b8a">01</text><text x="130" y="452" fill="#e6edf3">index.html</text>
    <line x1="290" y1="448" x2="620" y2="448" stroke="#1f3b63" stroke-dasharray="1 5"/>
    <text x="800" y="452" text-anchor="end" fill="#60a5fa">startseite</text>

    <text x="90" y="480" fill="#3b5b8a">02</text><text x="130" y="480" fill="#e6edf3">skills.html</text>
    <line x1="290" y1="476" x2="620" y2="476" stroke="#1f3b63" stroke-dasharray="1 5"/>
    <text x="800" y="480" text-anchor="end" fill="#60a5fa">was ich kann</text>

    <text x="90" y="508" fill="#3b5b8a">03</text><text x="130" y="508" fill="#e6edf3">erfahrung.html</text>
    <line x1="290" y1="504" x2="620" y2="504" stroke="#1f3b63" stroke-dasharray="1 5"/>
    <text x="800" y="508" text-anchor="end" fill="#60a5fa">meine erfahrung</text>

    <text x="90" y="536" fill="#3b5b8a">04</text><text x="130" y="536" fill="#e6edf3">hobbys.html</text>
    <line x1="290" y1="532" x2="620" y2="532" stroke="#1f3b63" stroke-dasharray="1 5"/>
    <text x="800" y="536" text-anchor="end" fill="#60a5fa">handball &amp; co.</text>

    <text x="90" y="564" fill="#3b5b8a">05</text><text x="130" y="564" fill="#e6edf3">kontakt.html</text>
    <line x1="290" y1="560" x2="620" y2="560" stroke="#1f3b63" stroke-dasharray="1 5"/>
    <text x="800" y="564" text-anchor="end" fill="#60a5fa">schreib mir</text>
  </g>

  <!-- built with -->
  <text x="90" y="612" class="mono" font-size="14" fill="#60a5fa">built with</text>
  <line x1="190" y1="608" x2="800" y2="608" stroke="#1f3b63" stroke-dasharray="3 4"/>

  <g class="mono" font-size="13" text-anchor="middle">
    <rect x="90" y="630" width="74" height="28" rx="14" fill="#111a2b" stroke="#2f5fa8"/>
    <text x="127" y="649" fill="#e6edf3">html</text>
    <rect x="176" y="630" width="66" height="28" rx="14" fill="#111a2b" stroke="#2f5fa8"/>
    <text x="209" y="649" fill="#e6edf3">css</text>
    <rect x="254" y="630" width="120" height="28" rx="14" fill="#111a2b" stroke="#2f5fa8"/>
    <text x="314" y="649" fill="#e6edf3">javascript</text>
    <rect x="386" y="630" width="140" height="28" rx="14" fill="#111a2b" stroke="#2f5fa8"/>
    <text x="456" y="649" fill="#e6edf3">github pages</text>
  </g>

  <!-- im repo -->
  <text x="90" y="702" class="mono" font-size="14" fill="#60a5fa">im repo</text>
  <line x1="170" y1="698" x2="800" y2="698" stroke="#1f3b63" stroke-dasharray="3 4"/>

  <g class="mono" text-anchor="middle">
    <rect x="90" y="720" width="226" height="72" rx="12" fill="#111a2b" stroke="#1f3b63"/>
    <text x="203" y="754" font-size="26" fill="#93c5fd">5</text>
    <text x="203" y="777" font-size="12" fill="#8b949e">seiten</text>

    <rect x="332" y="720" width="226" height="72" rx="12" fill="#111a2b" stroke="#1f3b63"/>
    <text x="445" y="754" font-size="26" fill="#93c5fd">3</text>
    <text x="445" y="777" font-size="12" fill="#8b949e">video-hintergründe</text>

    <rect x="574" y="720" width="226" height="72" rx="12" fill="#111a2b" stroke="#1f3b63"/>
    <text x="687" y="754" font-size="26" fill="#93c5fd">0</text>
    <text x="687" y="777" font-size="12" fill="#8b949e">frameworks</text>
  </g>

  <!-- footer -->
  <line x1="60" y1="820" x2="800" y2="820" stroke="#1f3b63"/>
  <text x="430" y="854" text-anchor="middle" class="mono" font-size="13" fill="#3b82f6" xml:space="preserve"><tspan class="tw">o</tspan>  ·  <tspan class="tw" style="animation-delay:.5s">*</tspan>  ·  <tspan class="tw" style="animation-delay:1s">o</tspan>  ·  <tspan class="tw" style="animation-delay:1.5s" opacity=".5">*</tspan>  ·  <tspan class="tw" style="animation-delay:2s" opacity=".4">o</tspan></text>
  <rect x="50" y="876" width="760" height="3" rx="1.5" fill="url(#line)"/>
</svg>

